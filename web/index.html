<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#090b13">
  <title>20XX</title>
  <link rel="icon" href="data:,">
  <link rel="stylesheet" href="game.css">
  <script type="module" src="lobby.js"></script>
  <script type="module" src="scene.js"></script>
</head>
<body>
  <main id="game">
    <canvas id="scene" tabindex="0" aria-label="Melee stage and characters. Drag or use arrow keys to rotate the camera."></canvas>
    <div id="loading" role="status">Loading…</div>
    <p id="scene-status" class="sr-only" role="status"></p>
    <button id="menu-toggle" class="icon-button" aria-label="Open menu" aria-haspopup="dialog" aria-controls="menu">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 6h16M4 12h16M4 18h16"/></svg>
    </button>
    <dialog id="menu" aria-labelledby="menu-title">
      <div class="menu-heading"><h1 id="menu-title">20XX</h1><button id="menu-close" class="icon-button" aria-label="Close menu">×</button></div>
      <div id="seats" aria-label="Lobby seats"></div>
      <p id="room-status" role="status">Offline</p>
      <button id="create">Create lobby</button>
      <button id="join" hidden>Join lobby</button>
      <button id="copy-room" hidden>Copy invite</button>
      <input id="invite" aria-label="Lobby invitation link" readonly hidden>
      <button id="leave" class="quiet" hidden>Leave lobby</button>
      <p id="feedback" role="status" hidden></p>
      <hr>
      <label for="scene-view">View</label>
      <select id="scene-view" disabled><option value="stage">Final Destination</option><option value="fox">Fox</option><option value="mario">Mario</option><option value="marth">Marth</option><option value="falcon">Captain Falcon</option></select>
      <button id="scene-reset" class="quiet" disabled>Reset camera</button>
      <button id="fullscreen" class="quiet">Fullscreen</button>
      <p id="error" role="alert" hidden></p>
    </dialog>
  </main>
</body>
</html>
